<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prince Shopping Mall</title>
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    
    <style>
        /* Modern Fonts & Animations */
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap');
        
        body { font-family: 'Poppins', sans-serif; margin: 0; padding: 0; background-color: #f8f9fa; color: #333; }
        
        /* Header & Navbar */
        header { background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%); color: white; padding: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.2); }
        .top-bar { display: flex; justify-content: space-between; align-items: center; max-width: 1200px; margin: 0 auto; }
        .top-bar h1 { margin: 0; font-size: 28px; letter-spacing: 1px; color: #facc15; }
        .auth-buttons button { background: white; color: #1e3c72; border: none; padding: 8px 15px; border-radius: 20px; font-weight: bold; cursor: pointer; transition: 0.3s; margin-left: 10px; }
        .auth-buttons button:hover { background: #facc15; transform: scale(1.05); }
        
        /* Category Navigation */
        .categories { display: flex; justify-content: center; gap: 15px; padding: 20px; background: white; box-shadow: 0 2px 5px rgba(0,0,0,0.05); flex-wrap: wrap; }
        .cat-btn { background: #e5e7eb; border: none; padding: 10px 20px; border-radius: 25px; cursor: pointer; font-weight: 600; transition: all 0.3s ease; }
        .cat-btn:hover, .cat-btn.active { background: #1e3c72; color: white; transform: translateY(-2px); }

        /* Product Grid & Cards with Animation */
        .container { max-width: 1200px; margin: 30px auto; padding: 0 20px; display: flex; flex-wrap: wrap; justify-content: center; gap: 25px; }
        .product-card { background: white; width: 280px; border-radius: 15px; box-shadow: 0 10px 20px rgba(0,0,0,0.08); overflow: hidden; text-align: center; transition: all 0.4s ease; opacity: 0; animation: fadeIn 0.8s forwards; position: relative; }
        .product-card:hover { transform: translateY(-10px); box-shadow: 0 15px 25px rgba(0,0,0,0.15); }
        .product-card img { width: 100%; height: 260px; object-fit: cover; transition: 0.5s; }
        .product-card:hover img { transform: scale(1.05); }
        .card-body { padding: 20px; }
        .product-title { font-size: 18px; margin: 0 0 10px; color: #1f2937; }
        .product-price { font-size: 22px; color: #10b981; font-weight: 700; margin-bottom: 15px; }
        
        .buy-btn { background: linear-gradient(45deg, #25D366, #128C7E); color: white; border: none; padding: 12px 20px; font-size: 16px; border-radius: 30px; cursor: pointer; font-weight: bold; width: 100%; transition: 0.3s; box-shadow: 0 4px 10px rgba(37, 211, 102, 0.3); }
        .buy-btn:hover { box-shadow: 0 6px 15px rgba(37, 211, 102, 0.5); }
        
        @keyframes fadeIn { to { opacity: 1; } }

        /* Modals (Login/Signup & Admin) */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); backdrop-filter: blur(5px); z-index: 100; align-items: center; justify-content: center; }
        .modal-content { background: white; padding: 30px; border-radius: 15px; width: 90%; max-width: 400px; position: relative; animation: slideDown 0.4s ease; text-align: center; }
        @keyframes slideDown { from { transform: translateY(-50px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        .close-btn { position: absolute; top: 15px; right: 15px; font-size: 24px; cursor: pointer; color: #666; }
        .form-group input, .form-group select { width: 90%; padding: 12px; margin: 10px 0; border: 1px solid #ccc; border-radius: 8px; font-family: 'Poppins'; }
        .action-btn { background: #1e3c72; color: white; border: none; padding: 12px; width: 100%; border-radius: 8px; font-size: 16px; cursor: pointer; margin-top: 10px; }

        footer { background: #1f2937; color: white; text-align: center; padding: 30px 10px; margin-top: 50px; }
        .admin-link { color: #9ca3af; font-size: 12px; cursor: pointer; text-decoration: underline; margin-top: 20px; display: inline-block; }
    </style>
</head>
<body>

    <header>
        <div class="top-bar">
            <div>
                <h1>Prince Shopping Mall</h1>
                <p style="margin: 5px 0 0; font-size: 13px;">📍 Bhaggarwa Bazar, Huzoorpur Road 271872</p>
            </div>
            <div class="auth-buttons" id="auth-section">
                <button onclick="openModal('loginModal')">Log In</button>
                <button onclick="openModal('signupModal')">Sign Up</button>
            </div>
        </div>
    </header>

    <!-- Category Filter -->
    <div class="categories">
        <button class="cat-btn active" onclick="filterProducts('All')">All Collection</button>
        <button class="cat-btn" onclick="filterProducts('Gents')">Gents</button>
        <button class="cat-btn" onclick="filterProducts('Ladies')">Ladies</button>
        <button class="cat-btn" onclick="filterProducts('Kids')">Kids & Girls</button>
        <button class="cat-btn" onclick="filterProducts('Wedding')">Wedding Shoot</button>
    </div>

    <!-- Products Grid -->
    <div class="container" id="product-list">
        <h3 style="color: gray; width: 100%; text-align: center;">Loading amazing products...</h3>
    </div>

    <footer>
        <p>&copy; 2026 Prince Shopping Mall. All Rights Reserved.</p>
        <p>WhatsApp Us: 9621068266</p>
        <span class="admin-link" onclick="openModal('adminLoginModal')">Admin Login (Store Owner)</span>
    </footer>

    <!-- Customer Sign Up Modal -->
    <div id="signupModal" class="modal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeModal('signupModal')">&times;</span>
            <h2>Create Account</h2>
            <div class="form-group"><input type="email" id="su-email" placeholder="Email Address"></div>
            <div class="form-group"><input type="password" id="su-pass" placeholder="Create Password (min 6 char)"></div>
            <button class="action-btn" onclick="signUp()">Sign Up</button>
        </div>
    </div>

    <!-- Customer Login Modal -->
    <div id="loginModal" class="modal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeModal('loginModal')">&times;</span>
            <h2>Welcome Back</h2>
            <div class="form-group"><input type="email" id="li-email" placeholder="Email Address"></div>
            <div class="form-group"><input type="password" id="li-pass" placeholder="Password"></div>
            <button class="action-btn" onclick="login()">Log In</button>
        </div>
    </div>

    <!-- Admin Login Modal -->
    <div id="adminLoginModal" class="modal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeModal('adminLoginModal')">&times;</span>
            <h2>Admin Login</h2>
            <div class="form-group"><input type="password" id="admin-pass" placeholder="Enter PIN"></div>
            <button class="action-btn" onclick="adminLogin()">Access Panel</button>
        </div>
    </div>

    <!-- Admin Add Product Modal -->
    <div id="adminPanelModal" class="modal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeModal('adminPanelModal')">&times;</span>
            <h2>Add New Product</h2>
            <div class="form-group"><input type="text" id="p-name" placeholder="Product Name"></div>
            <div class="form-group"><input type="number" id="p-price" placeholder="Price (₹)"></div>
            <div class="form-group">
                <select id="p-category">
                    <option value="Gents">Gents</option>
                    <option value="Ladies">Ladies</option>
                    <option value="Kids">Kids & Girls</option>
                    <option value="Wedding">Wedding Shoot</option>
                </select>
            </div>
            <div class="form-group"><input type="text" id="p-image" placeholder="Image URL (Link)"></div>
            <button class="action-btn" onclick="addProduct()" style="background: #10b981;">➕ Publish Product</button>
        </div>
    </div>

    <script>
        // 1. Firebase Config (Aapki chabi)
        const firebaseConfig = {
            apiKey: "AIzaSyC2g3DSehlNzeDKaKiWgizcwURIzNstbmE",
            authDomain: "prince-shopping-mall.firebaseapp.com",
            databaseURL: "https://prince-shopping-mall-default-rtdb.firebaseio.com",
            projectId: "prince-shopping-mall",
            storageBucket: "prince-shopping-mall.firebasestorage.app",
            messagingSenderId: "524767266509",
            appId: "1:524767266509:web:642fd2a3dd85578b8acb84"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        const auth = firebase.auth();
        let isAdmin = false;
        let allProducts = {};

        // Modal Functions
        function openModal(id) { document.getElementById(id).style.display = 'flex'; }
        function closeModal(id) { document.getElementById(id).style.display = 'none'; }

        // Customer Authentication
        auth.onAuthStateChanged(user => {
            if (user) {
                document.getElementById('auth-section').innerHTML = `<span style="margin-right:15px;">👤 ${user.email.split('@')[0]}</span> <button onclick="auth.signOut()">Logout</button>`;
            } else {
                document.getElementById('auth-section').innerHTML = `<button onclick="openModal('loginModal')">Log In</button> <button onclick="openModal('signupModal')">Sign Up</button>`;
            }
        });

        function signUp() {
            const email = document.getElementById('su-email').value;
            const pass = document.getElementById('su-pass').value;
            auth.createUserWithEmailAndPassword(email, pass).then(() => {
                alert("Account created successfully!"); closeModal('signupModal');
            }).catch(e => alert(e.message));
        }

        function login() {
            const email = document.getElementById('li-email').value;
            const pass = document.getElementById('li-pass').value;
            auth.signInWithEmailAndPassword(email, pass).then(() => {
                alert("Logged in!"); closeModal('loginModal');
            }).catch(e => alert(e.message));
        }

        // Admin Access
        function adminLogin() {
            if (document.getElementById('admin-pass').value === "9621") {
                isAdmin = true;
                closeModal('adminLoginModal');
                openModal('adminPanelModal');
                document.getElementById('admin-pass').value = '';
                displayProducts('All'); // Refresh to show delete buttons
            } else { alert("Wrong PIN!"); }
        }

        // Load & Display Products
        db.ref('products').on('value', (snapshot) => {
            allProducts = snapshot.val() || {};
            displayProducts('All');
        });

        function displayProducts(category) {
            const container = document.getElementById('product-list');
            container.innerHTML = '';
            
            if (Object.keys(allProducts).length === 0) {
                container.innerHTML = '<h3>No products yet. Admin please login to add.</h3>';
                return;
            }

            for (let id in allProducts) {
                let product = allProducts[id];
                if (category === 'All' || product.category === category) {
                    let adminBtn = isAdmin ? `<button onclick="deleteProduct('${id}')" style="background:red; color:white; border:none; padding:5px 10px; border-radius:5px; margin-top:10px; cursor:pointer;">🗑️ Delete</button>` : '';
                    
                    container.innerHTML += `
                        <div class="product-card">
                            <img src="${product.image}" onerror="this.src='https://via.placeholder.com/280x260?text=Prince+Mall'">
                            <div class="card-body">
                                <p style="font-size:12px; color:gray; margin:0 0 5px;">${product.category}</p>
                                <h3 class="product-title">${product.name}</h3>
                                <div class="product-price">₹${product.price}</div>
                                <button class="buy-btn" onclick="orderOnWhatsApp('${product.name}', '${product.price}')">🛒 Buy Now</button>
                                ${adminBtn}
                            </div>
                        </div>
                    `;
                }
            }
            
            // Update Active Category Button Styling
            document.querySelectorAll('.cat-btn').forEach(btn => btn.classList.remove('active'));
            event && event.target.classList.add('active');
        }

        function filterProducts(cat) { displayProducts(cat); }

        function addProduct() {
            const name = document.getElementById('p-name').value;
            const price = document.getElementById('p-price').value;
            const category = document.getElementById('p-category').value;
            let image = document.getElementById('p-image').value || "https://images.unsplash.com/photo-1441984904996-e0b6ba687e04?w=500";

            if (!name || !price) return alert("Name and Price are required!");

            db.ref('products').push({ name, price, category, image });
            alert("Product Added Successfully!");
            
            document.getElementById('p-name').value = '';
            document.getElementById('p-price').value = '';
            document.getElementById('p-image').value = '';
        }

        function deleteProduct(id) {
            if(confirm("Delete this product?")) db.ref('products/' + id).remove();
        }

        function orderOnWhatsApp(name, price) {
            if(!auth.currentUser) return alert("Please Log In or Sign Up to place an order.");
            let msg = `Namaste!\nItem: ${name}\nPrice: ₹${price}\nCustomer Email: ${auth.currentUser.email}\nKripya order process karein.`;
            window.open(`https://wa.me/919621068266?text=${encodeURIComponent(msg)}`, "_blank");
        }
    </script>
</body>
</html>
